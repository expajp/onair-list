<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空気階段の踊り場 オンエア曲一覧</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --line: #d8dee4;
    --head: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --line: #30363d;
      --head: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  h1 { margin: 0 0 16px; font-size: 1.4rem; }
  #status { color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  th { background: var(--head); white-space: nowrap; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.selector { white-space: nowrap; }
  th button {
    all: unset;
    cursor: pointer;
    font-weight: 600;
  }
  th button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .filters th { background: var(--bg); font-weight: 400; }
  .filters input, .filters select {
    width: 100%;
    min-width: 7em;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  #count { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>空気階段の踊り場 オンエア曲一覧</h1>
  <p id="status">読み込み中です。</p>
  <p id="count" hidden></p>
  <div class="scroll">
    <table hidden>
      <thead>
        <tr id="head"></tr>
        <tr id="filters" class="filters"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <script>
    // CSV を更新するだけで一覧へ反映されるよう、表示時に読み込む。
    const CSV_PATH = "data/onair_songs.csv";

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') quoted = false;
          else cell += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c !== "\r") cell += c;
      }
      if (cell !== "" || row.length > 0) { row.push(cell); rows.push(row); }
      return rows;
    }

    // プルダウンで絞り込む列。その他の列は文字の部分一致で絞り込む。
    const SELECT_COLUMNS = new Set(["選曲者"]);
    const BLANK = "\u0000blank";
    const collator = new Intl.Collator("ja", { numeric: true, sensitivity: "base" });
    const normalize = (value) => value.normalize("NFKC").toLowerCase();

    function renderTable(header, rows, filters, sort) {
      const shown = rows.filter((row) => filters.every((filter, i) => {
        if (filter === "") return true;
        if (filter === BLANK) return row.cells[i] === "";
        if (SELECT_COLUMNS.has(header[i])) return row.cells[i] === filter;
        return normalize(row.cells[i]).includes(normalize(filter));
      }));

      if (sort.column !== null) {
        const c = sort.column;
        shown.sort((a, b) => {
          // 空欄は昇順でも降順でも末尾に置く。
          if (a.cells[c] === "" || b.cells[c] === "") {
            return (a.cells[c] === "") - (b.cells[c] === "") || a.index - b.index;
          }
          return sort.direction * collator.compare(a.cells[c], b.cells[c]) || a.index - b.index;
        });
      }

      const fragment = document.createDocumentFragment();
      for (const row of shown) {
        const tr = document.createElement("tr");
        row.cells.forEach((value, i) => {
          const td = document.createElement("td");
          td.textContent = value;
          if (header[i] === "オンエア日") td.className = "date";
          if (header[i] === "選曲者") td.className = "selector";
          tr.append(td);
        });
        fragment.append(tr);
      }
      document.getElementById("body").replaceChildren(fragment);
      document.getElementById("count").textContent = `${rows.length}件中 ${shown.length}件を表示`;

      document.querySelectorAll("#head th").forEach((th, i) => {
        const active = sort.column === i;
        th.setAttribute("aria-sort", active ? (sort.direction > 0 ? "ascending" : "descending") : "none");
        th.querySelector("button").textContent = header[i] + (active ? (sort.direction > 0 ? " ▲" : " ▼") : "");
      });
    }

    function buildFilter(name, values, onChange) {
      if (SELECT_COLUMNS.has(name)) {
        const select = document.createElement("select");
        select.setAttribute("aria-label", `${name}で絞り込む`);
        const options = [["", "すべて"], ...[...new Set(values)].filter(Boolean).map((v) => [v, v]), [BLANK, "（空欄）"]];
        for (const [value, label] of options) select.add(new Option(label, value));
        select.addEventListener("change", () => onChange(select.value));
        return select;
      }
      const input = document.createElement("input");
      input.type = "search";
      input.placeholder = "絞り込み";
      input.setAttribute("aria-label", `${name}で絞り込む`);
      input.addEventListener("input", () => onChange(input.value.trim()));
      return input;
    }

    async function main() {
      const status = document.getElementById("status");
      try {
        const res = await fetch(CSV_PATH, { cache: "no-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^\uFEFF/, "");
        const [header, ...records] = parseCsv(text);
        const rows = records.map((cells, index) => ({ cells, index }));
        const filters = header.map(() => "");
        const sort = { column: null, direction: 1 };
        const render = () => renderTable(header, rows, filters, sort);

        header.forEach((name, i) => {
          const th = document.createElement("th");
          th.scope = "col";
          const button = document.createElement("button");
          button.type = "button";
          button.title = `${name}で並べ替える`;
          button.addEventListener("click", () => {
            // 昇順、降順、元の順の順に切り替える。
            if (sort.column !== i) { sort.column = i; sort.direction = 1; }
            else if (sort.direction > 0) sort.direction = -1;
            else { sort.column = null; sort.direction = 1; }
            render();
          });
          th.append(button);
          document.getElementById("head").append(th);

          const cell = document.createElement("th");
          cell.append(buildFilter(name, rows.map((row) => row.cells[i]), (value) => {
            filters[i] = value;
            render();
          }));
          document.getElementById("filters").append(cell);
        });

        render();
        document.querySelector("table").hidden = false;
        document.getElementById("count").hidden = false;
        status.hidden = true;
      } catch (error) {
        status.textContent = `一覧を読み込めませんでした（${error.message}）。`;
      }
    }

    main();
  </script>
</body>
</html>
