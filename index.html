<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ラジオ番組で流れた曲の記録">
<title>オンエア曲一覧</title>
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #fff;
    --text: #1c1c1a;
    --text-muted: #6b6b66;
    --border: #e2e1dc;
    --accent: #c2410c;
    --row-hover: #f3f2ee;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --surface: #1f1f1d;
      --text: #ecebe6;
      --text-muted: #a3a29b;
      --border: #34332f;
      --accent: #fb923c;
      --row-hover: #2a2926;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  button, input, select { font: inherit; color: inherit; }
  input, select {
    min-width: 0;
    padding: 4px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  .header h1 { margin: 0; font-size: 1.6rem; }
  .lead { margin: 4px 0 20px; color: var(--text-muted); }
  .note { display: block; font-size: 0.85rem; }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }
  .tabs a {
    padding: 8px 12px;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .tabs a:hover { color: var(--text); }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tabs a[aria-current] { border-bottom-color: var(--accent); color: var(--text); }
  .card {
    margin-bottom: 16px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .card[hidden] { display: none; }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .card-head h2 { margin: 0; font-size: 1.1rem; }
  .filters { display: grid; gap: 14px; }
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .filter-grid label { display: grid; gap: 4px; font-weight: 600; }
  .filter-grid input, .filter-grid select { width: 100%; font-weight: 400; }
  .filter-actions { display: flex; }
  button.link {
    margin-left: auto;
    padding: 0;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
  }
  .muted { margin: 0; color: var(--text-muted); font-size: 0.85rem; }
  .message { margin: 8px 0; color: var(--text-muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  td.wrap { min-width: 8em; white-space: normal; }
  td.date { font-variant-numeric: tabular-nums; }
  th button {
    padding: 0;
    background: none;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sort-mark {
    display: inline-block;
    width: 1em;
    color: var(--accent);
    font-size: 0.7rem;
  }
  tbody tr:hover { background: var(--row-hover); }
</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 id="title"></h1>
      <p class="lead">
        <span id="lead"></span>
        <span class="note" id="caveat"></span>
        <span class="note" id="period"></span>
      </p>
    </header>

    <nav class="tabs" id="tabs" aria-label="番組"></nav>

    <section class="card filters" id="filters-card" hidden>
      <div class="filter-grid" id="filters"></div>
      <div class="filter-actions">
        <button class="link" id="reset" type="button">条件をリセット</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>曲の一覧</h2>
        <p class="muted" id="count"></p>
      </div>
      <p class="message" id="status">読み込み中です。</p>
      <div class="table-wrap">
        <table hidden>
          <thead><tr id="head"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // CSV を更新するだけで一覧へ反映されるよう、表示時に読み込む。
    const PROGRAMS = [
      {
        id: "odoriba",
        name: "空気階段の踊り場",
        tab: "空気階段の踊り場",
        station: "TBSラジオ",
        csv: "data/onair_songs.csv",
      },
      {
        id: "ann0",
        name: "マヂカルラブリーのオールナイトニッポン0(ZERO)",
        tab: "マヂカルラブリーのANN0",
        station: "ニッポン放送",
        csv: "data/magical_lovely_ann0_songs.csv",
        caveat: "ファンサイト、Spotify、Xの投稿をもとにした記録で、推定や抜け漏れを含みます。",
        hiddenColumns: ["情報源"],
      },
    ];
    // プルダウンで絞り込む列。その他の列は文字の部分一致で絞り込む。
    const SELECT_COLUMNS = new Set(["選曲者"]);
    const NOWRAP_COLUMNS = new Set(["オンエア日", "選曲者"]);
    const BLANK = "\u0000blank";
    const collator = new Intl.Collator("ja", { numeric: true, sensitivity: "base" });
    const normalize = (value) => value.normalize("NFKC").toLowerCase();

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') quoted = false;
          else cell += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c !== "\r") cell += c;
      }
      if (cell !== "" || row.length > 0) { row.push(cell); rows.push(row); }
      return rows;
    }

    function renderTable(header, rows, filters, sort) {
      const shown = rows.filter((row) => filters.every((filter, i) => {
        if (filter === "") return true;
        if (filter === BLANK) return row.cells[i] === "";
        if (SELECT_COLUMNS.has(header[i])) return row.cells[i] === filter;
        return normalize(row.cells[i]).includes(normalize(filter));
      }));

      if (sort.column !== null) {
        const c = sort.column;
        shown.sort((a, b) => {
          // 空欄は昇順でも降順でも末尾に置く。
          if (a.cells[c] === "" || b.cells[c] === "") {
            return (a.cells[c] === "") - (b.cells[c] === "") || a.index - b.index;
          }
          return sort.direction * collator.compare(a.cells[c], b.cells[c]) || a.index - b.index;
        });
      }

      const fragment = document.createDocumentFragment();
      for (const row of shown) {
        const tr = document.createElement("tr");
        row.cells.forEach((value, i) => {
          const td = document.createElement("td");
          td.textContent = value;
          if (!NOWRAP_COLUMNS.has(header[i])) td.className = "wrap";
          if (header[i] === "オンエア日") td.className = "date";
          tr.append(td);
        });
        fragment.append(tr);
      }
      document.getElementById("body").replaceChildren(fragment);
      document.getElementById("count").textContent =
        shown.length === rows.length ? `${rows.length}件` : `${rows.length}件中 ${shown.length}件`;

      document.querySelectorAll("#head th").forEach((th, i) => {
        const active = sort.column === i;
        th.setAttribute("aria-sort", active ? (sort.direction > 0 ? "ascending" : "descending") : "none");
        th.querySelector(".sort-mark").textContent = active ? (sort.direction > 0 ? "▲" : "▼") : "";
      });
    }

    function buildFilter(name, values, onChange) {
      const label = document.createElement("label");
      label.textContent = name;
      let control;
      if (SELECT_COLUMNS.has(name)) {
        control = document.createElement("select");
        const options = [["", "すべて"], ...[...new Set(values)].filter(Boolean).map((v) => [v, v]), [BLANK, "（空欄）"]];
        for (const [value, text] of options) control.add(new Option(text, value));
        control.addEventListener("change", () => onChange(control.value));
      } else {
        control = document.createElement("input");
        control.type = "search";
        control.placeholder = "入力すると絞り込みます";
        control.addEventListener("input", () => onChange(control.value.trim()));
      }
      label.append(control);
      return label;
    }

    function resetPage(program) {
      document.title = `${program.name} オンエア曲一覧`;
      document.getElementById("title").textContent = `${program.name} オンエア曲一覧`;
      document.getElementById("lead").textContent = `${program.station}「${program.name}」で流れた曲の記録`;
      document.getElementById("caveat").textContent = program.caveat ?? "";
      document.getElementById("period").textContent = "";
      document.getElementById("count").textContent = "";
      document.getElementById("head").replaceChildren();
      document.getElementById("filters").replaceChildren();
      document.getElementById("body").replaceChildren();
      document.querySelector("table").hidden = true;
      document.getElementById("filters-card").hidden = true;
      document.querySelectorAll("#tabs a").forEach((tab) => {
        if (tab.hash === `#${program.id}`) tab.setAttribute("aria-current", "page");
        else tab.removeAttribute("aria-current");
      });
    }

    let latestLoad = 0;

    async function showProgram(program) {
      const load = ++latestLoad;
      const status = document.getElementById("status");
      resetPage(program);
      status.textContent = "読み込み中です。";
      status.hidden = false;
      try {
        const res = await fetch(program.csv, { cache: "no-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^﻿/, "");
        // 読み込み中に別の番組へ切り替えていたら、この結果は捨てる。
        if (load !== latestLoad) return;
        const [allColumns, ...records] = parseCsv(text);
        const shownColumns = allColumns.flatMap((name, i) => (program.hiddenColumns?.includes(name) ? [] : [i]));
        const header = shownColumns.map((i) => allColumns[i]);
        const rows = records.map((cells, index) => ({ cells: shownColumns.map((i) => cells[i]), index }));
        const filters = header.map(() => "");
        const sort = { column: null, direction: 1 };
        const render = () => renderTable(header, rows, filters, sort);

        header.forEach((name, i) => {
          const th = document.createElement("th");
          th.scope = "col";
          const button = document.createElement("button");
          button.type = "button";
          button.title = `${name}で並べ替える`;
          const mark = document.createElement("span");
          mark.className = "sort-mark";
          button.append(name, mark);
          button.addEventListener("click", () => {
            // 昇順、降順、元の順の順に切り替える。
            if (sort.column !== i) { sort.column = i; sort.direction = 1; }
            else if (sort.direction > 0) sort.direction = -1;
            else { sort.column = null; sort.direction = 1; }
            render();
          });
          th.append(button);
          document.getElementById("head").append(th);

          document.getElementById("filters").append(
            buildFilter(name, rows.map((row) => row.cells[i]), (value) => {
              filters[i] = value;
              render();
            })
          );
        });

        document.getElementById("reset").onclick = () => {
          filters.fill("");
          sort.column = null;
          sort.direction = 1;
          document.querySelectorAll("#filters input, #filters select").forEach((control) => { control.value = ""; });
          render();
        };

        const dateColumn = header.indexOf("オンエア日");
        document.getElementById("period").textContent =
          `記録の期間：${rows[0].cells[dateColumn]} 〜 ${rows[rows.length - 1].cells[dateColumn]}`;

        render();
        document.querySelector("table").hidden = false;
        document.getElementById("filters-card").hidden = false;
        status.hidden = true;
      } catch (error) {
        if (load === latestLoad) status.textContent = `一覧を読み込めませんでした（${error.message}）。`;
      }
    }

    function showCurrentProgram() {
      showProgram(PROGRAMS.find((program) => `#${program.id}` === location.hash) ?? PROGRAMS[0]);
    }

    for (const program of PROGRAMS) {
      const tab = document.createElement("a");
      tab.href = `#${program.id}`;
      tab.textContent = program.tab;
      document.getElementById("tabs").append(tab);
    }
    window.addEventListener("hashchange", showCurrentProgram);
    showCurrentProgram();
  </script>
</body>
</html>
