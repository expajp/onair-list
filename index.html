<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空気階段の踊り場 オンエア曲一覧</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --line: #d8dee4;
    --head: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --line: #30363d;
      --head: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  h1 { margin: 0 0 16px; font-size: 1.4rem; }
  #status { color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  th { background: var(--head); white-space: nowrap; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.selector { white-space: nowrap; }
</style>
</head>
<body>
  <h1>空気階段の踊り場 オンエア曲一覧</h1>
  <p id="status">読み込み中です。</p>
  <div class="scroll">
    <table hidden>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <script>
    // CSV を更新するだけで一覧へ反映されるよう、表示時に読み込む。
    const CSV_PATH = "data/onair_songs.csv";

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') quoted = false;
          else cell += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c !== "\r") cell += c;
      }
      if (cell !== "" || row.length > 0) { row.push(cell); rows.push(row); }
      return rows;
    }

    async function main() {
      const status = document.getElementById("status");
      try {
        const res = await fetch(CSV_PATH, { cache: "no-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^﻿/, "");
        const [header, ...rows] = parseCsv(text);

        const head = document.getElementById("head");
        for (const name of header) {
          const th = document.createElement("th");
          th.textContent = name;
          head.append(th);
        }

        const body = document.getElementById("body");
        const fragment = document.createDocumentFragment();
        for (const row of rows) {
          const tr = document.createElement("tr");
          row.forEach((value, i) => {
            const td = document.createElement("td");
            td.textContent = value;
            if (header[i] === "オンエア日") td.className = "date";
            if (header[i] === "選曲者") td.className = "selector";
            tr.append(td);
          });
          fragment.append(tr);
        }
        body.append(fragment);
        document.querySelector("table").hidden = false;
        status.hidden = true;
      } catch (error) {
        status.textContent = `一覧を読み込めませんでした（${error.message}）。`;
      }
    }

    main();
  </script>
</body>
</html>
